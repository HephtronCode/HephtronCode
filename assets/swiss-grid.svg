<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Swiss Grid — HephtronCode, a twelve-column grid drawn rather than hidden, with one red accent">
  <title>HephtronCode — Swiss Grid</title>
  <desc>A twelve-column grid drawn rather than hidden. Everything sits on a column edge or a baseline; the single red is the only thing allowed to break the black.</desc>
  <defs>
    <pattern id="sg-col" x="72" y="0" width="88" height="420" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="76" height="420" fill="#0f0f0f" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#f2f0eb"/>
  <rect x="72" y="0" width="1056" height="420" fill="url(#sg-col)"/>

  <g stroke="#0f0f0f" opacity="0.09">
    <line x1="72" y1="72" x2="1128" y2="72"/>
    <line x1="72" y1="156" x2="1128" y2="156"/>
    <line x1="72" y1="240" x2="1128" y2="240"/>
    <line x1="72" y1="324" x2="1128" y2="324"/>
  </g>

  <rect x="72" y="42" width="1056" height="6" fill="#0f0f0f"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Inter', system-ui, sans-serif">
    <text x="72" y="66" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="4">FULL-STACK &amp; DATA ENGINEER</text>
    <text x="1128" y="66" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="4">HEPHTRONCODE · MMXXVI</text>

    <text x="66" y="236" font-size="92" font-weight="700" fill="#0f0f0f" letter-spacing="-5">Babatunde</text>
    <text x="520" y="236" font-size="92" font-weight="700" fill="#d0021b" letter-spacing="-5">Abu-bakr</text>

    <text x="864" y="106" font-size="17" font-weight="500" fill="#0f0f0f">Full-stack &amp; data engineer.</text>
    <text x="864" y="130" font-size="17" font-weight="500" fill="#0f0f0f">Healthcare · fintech · data platforms.</text>
    <text x="864" y="154" font-size="17" font-weight="500" fill="#0f0f0f">Ship it, measure it, make it boring.</text>
    <rect x="864" y="178" width="44" height="4" fill="#d0021b"/>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <text x="72" y="290" fill="#6d6a63" letter-spacing="3">01</text>
      <text x="72" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">FinVault Engine</text>
      <text x="72" y="334" fill="#6d6a63">fraud detection · sub-50ms</text>

      <text x="336" y="290" fill="#6d6a63" letter-spacing="3">02</text>
      <text x="336" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">DeskNG</text>
      <text x="336" y="334" fill="#6d6a63">support ticketing · SLA clocks</text>

      <text x="600" y="290" fill="#6d6a63" letter-spacing="3">03</text>
      <text x="600" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">Aureleon Analytics</text>
      <text x="600" y="334" fill="#6d6a63">medallion pipeline · Airflow</text>

      <text x="864" y="290" fill="#6d6a63" letter-spacing="3">04</text>
      <text x="864" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f0f0f">More</text>
      <text x="864" y="334" fill="#6d6a63">github.com/HephtronCode</text>
    </g>

    <rect x="72" y="366" width="1056" height="1.5" fill="#0f0f0f"/>
    <text x="72" y="390" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="3">12 COLUMNS · 88 UNIT · 24 GUTTER</text>
    <text x="1128" y="390" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6d6a63" letter-spacing="3">GITHUB.COM/HEPHTRONCODE</text>
  </g>
</svg>
